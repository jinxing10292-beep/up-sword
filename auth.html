<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 검 키우기</title>
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-container">
    <div class="auth-box">
        <h1>검 키우기</h1>
        
        <!-- 로그인 탭 -->
        <div id="loginTab" class="tab active">
            <h2>로그인</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="이메일" required>
                <input type="password" id="loginPassword" placeholder="비밀번호" required>
                <button type="submit" class="btn-auth">로그인</button>
            </form>
            <p class="tab-switch">계정이 없으신가요? <a onclick="switchTab('signup')">회원가입</a></p>
            <div id="loginMsg" class="msg"></div>
        </div>

        <!-- 회원가입 탭 -->
        <div id="signupTab" class="tab">
            <h2>회원가입</h2>
            <form id="signupForm">
                <input type="email" id="signupEmail" placeholder="이메일" required>
                <input type="text" id="signupUsername" placeholder="닉네임" required>
                <input type="password" id="signupPassword" placeholder="비밀번호 (8자 이상)" required>
                <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 확인" required>
                <button type="submit" class="btn-auth">회원가입</button>
            </form>
            <p class="tab-switch">이미 계정이 있으신가요? <a onclick="switchTab('login')">로그인</a></p>
            <div id="signupMsg" class="msg"></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
