<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화 - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.game-container {
    max-width: 430px;
    margin: 0 auto;
    background: #f2f2f2;
    padding: 20px 18px 60px;
}

.sword-card {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.sword-image {
    text-align: center;
    margin-bottom: 20px;
}

.sword-icon {
    font-size: 80px;
    margin-bottom: 10px;
}

.sword-title {
    font-size: 18px;
    font-weight: 800;
    color: #111;
    margin-bottom: 5px;
}

.sword-level {
    font-size: 28px;
    font-weight: 800;
    color: #667eea;
}

.stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
}

.stat-box {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.stat-icon {
    font-size: 20px;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 16px;
    font-weight: 800;
    color: #111;
}

.stat-value.cost {
    color: #f5a623;
}

.stat-value.sell {
    color: #7b5bd6;
}

.stat-value.success {
    color: #4caf50;
}

.button-group {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
    margin-top: 20px;
}

.btn-store {
    padding: 16px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #111;
}

.btn-store:hover {
    background: #f5f5f5;
}

.btn-enhance {
    padding: 16px;
    background: linear-gradient(135deg, #2c3e50, #34495e);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.btn-enhance:hover:not(:disabled) {
    opacity: 0.8;
}

.btn-enhance:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.result-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.result-modal.show {
    display: flex;
}

.result-content {
    background: white;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    max-width: 300px;
}

.result-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.result-text {
    font-size: 20px;
    font-weight: 800;
    color: #111;
    margin-bottom: 10px;
}

.result-detail {
    font-size: 14px;
    color: #666;
}

.result-content.success {
    background: #d4edda;
    border: 2px solid #28a745;
}

.result-content.maintain {
    background: #fff3cd;
    border: 2px solid #ffc107;
}

.result-content.break {
    background: #f8d7da;
    border: 2px solid #dc3545;
}

.result-content.protect {
    background: #d1ecf1;
    border: 2px solid #17a2b8;
}

@keyframes bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@keyframes confetti {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100px) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>검 강화</h1>
    </div>

    <div class="game-container">
        <div class="sword-card">
            <!-- 검 이미지 -->
            <div class="sword-image">
                <div class="sword-icon">🗡️</div>
                <div class="sword-title">초보자의 검</div>
                <div class="sword-level" id="displayLevel">+0</div>
            </div>

            <!-- 통계 -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">강화 비용</div>
                    <div class="stat-icon">⚙️</div>
                    <div class="stat-value cost" id="costAmount">100G</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">판매 가격</div>
                    <div class="stat-icon">💰</div>
                    <div class="stat-value sell" id="sellPrice">0G</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">성공 확률</div>
                    <div class="stat-icon">✨</div>
                    <div class="stat-value success" id="successRate">100%</div>
                </div>
            </div>

            <!-- 버튼 -->
            <div class="button-group">
                <button class="btn-store" onclick="storeSword()">보관</button>
                <button class="btn-enhance" id="enhanceBtn" onclick="enhanceSword()">강화하기</button>
            </div>
        </div>
    </div>
</div>

<!-- 결과 모달 -->
<div class="result-modal" id="resultModal">
    <div class="result-content" id="resultContent">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-text" id="resultText"></div>
        <div class="result-detail" id="resultDetail"></div>
    </div>
</div>

<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
