<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>룰렛 - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.roulette-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.roulette-wheel-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 25px;
}

.roulette-wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #111;
    position: relative;
    overflow: hidden;
    background: conic-gradient(
        from 0deg,
        #ff0000 0deg 3.91deg,
        white 3.91deg 7.83deg,
        #ff0000 7.83deg 11.74deg,
        white 11.74deg 15.65deg,
        #ff0000 15.65deg 19.57deg,
        white 19.57deg 23.48deg,
        #ff0000 23.48deg 27.39deg,
        white 27.39deg 31.3deg,
        #ff0000 31.3deg 35.22deg,
        white 35.22deg 39.13deg,
        #ff0000 39.13deg 43.04deg,
        white 43.04deg 46.96deg,
        #ff0000 46.96deg 50.87deg,
        white 50.87deg 54.78deg,
        #ff0000 54.78deg 58.7deg,
        white 58.7deg 62.61deg,
        #ff0000 62.61deg 66.52deg,
        white 66.52deg 70.43deg,
        #ff0000 70.43deg 74.35deg,
        white 74.35deg 78.26deg,
        #ff0000 78.26deg 82.17deg,
        white 82.17deg 86.09deg,
        #ff0000 86.09deg 90deg,
        white 90deg 93.91deg,
        #ff0000 93.91deg 97.83deg,
        white 97.83deg 101.74deg,
        #ff0000 101.74deg 105.65deg,
        white 105.65deg 109.57deg,
        #ff0000 109.57deg 113.48deg,
        white 113.48deg 117.39deg,
        #ff0000 117.39deg 121.3deg,
        white 121.3deg 125.22deg,
        #ff0000 125.22deg 129.13deg,
        white 129.13deg 133.04deg,
        #ff0000 133.04deg 136.96deg,
        white 136.96deg 140.87deg,
        #ff0000 140.87deg 144.78deg,
        white 144.78deg 148.7deg,
        #ff0000 148.7deg 152.61deg,
        white 152.61deg 156.52deg,
        #ff0000 156.52deg 160.43deg,
        white 160.43deg 164.35deg,
        #ff0000 164.35deg 168.26deg,
        white 168.26deg 172.17deg,
        #ff0000 172.17deg 176.09deg,
        white 176.09deg 180deg,
        #ff0000 180deg 183.91deg,
        white 183.91deg 187.83deg,
        #ff0000 187.83deg 191.74deg,
        white 191.74deg 195.65deg,
        #ff0000 195.65deg 199.57deg,
        white 199.57deg 203.48deg,
        #ff0000 203.48deg 207.39deg,
        white 207.39deg 211.3deg,
        #ff0000 211.3deg 215.22deg,
        white 215.22deg 219.13deg,
        #ff0000 219.13deg 223.04deg,
        white 223.04deg 226.96deg,
        #ff0000 226.96deg 230.87deg,
        white 230.87deg 234.78deg,
        #ff0000 234.78deg 238.7deg,
        white 238.7deg 242.61deg,
        #ff0000 242.61deg 246.52deg,
        white 246.52deg 250.43deg,
        #ff0000 250.43deg 254.35deg,
        white 254.35deg 258.26deg,
        #ff0000 258.26deg 262.17deg,
        white 262.17deg 266.09deg,
        #ff0000 266.09deg 270deg,
        white 270deg 273.91deg,
        #ff0000 273.91deg 277.83deg,
        white 277.83deg 281.74deg,
        #ff0000 281.74deg 285.65deg,
        white 285.65deg 289.57deg,
        #ff0000 289.57deg 293.48deg,
        white 293.48deg 297.39deg,
        #ff0000 297.39deg 301.3deg,
        white 301.3deg 305.22deg,
        #ff0000 305.22deg 309.13deg,
        white 309.13deg 313.04deg,
        #ff0000 313.04deg 316.96deg,
        white 316.96deg 320.87deg,
        #ff0000 320.87deg 324.78deg,
        white 324.78deg 328.7deg,
        #ff0000 328.7deg 332.61deg,
        white 332.61deg 336.52deg,
        #ff0000 336.52deg 340.43deg,
        white 340.43deg 344.35deg,
        #ff0000 344.35deg 348.26deg,
        white 348.26deg 352.17deg,
        #ff0000 352.17deg 356.09deg,
        white 356.09deg 360deg
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: black;
    font-size: 10px;
}

.roulette-pointer {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    z-index: 10;
}

.bet-section {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
}

.bet-label {
    font-size: 14px;
    font-weight: 700;
    color: #666;
    margin-bottom: 10px;
}

.bet-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.bet-btn {
    padding: 12px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.bet-btn.active {
    background: #667eea;
    color: white;
    border-color: #667eea;
}

.bet-btn:hover {
    border-color: #667eea;
}

.bet-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 15px;
    font-weight: 700;
}

.current-gold {
    font-size: 14px;
    color: #666;
    margin-top: 10px;
}

.btn-spin {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #ffd89b, #ff7e5f);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 15px;
}

.btn-spin:hover:not(:disabled) {
    opacity: 0.9;
}

.btn-spin:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.result-display {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-top: 20px;
    display: none;
}

.result-display.show {
    display: block;
}

.result-title {
    font-size: 16px;
    font-weight: 700;
    color: #666;
    margin-bottom: 10px;
}

.result-amount {
    font-size: 28px;
    font-weight: 800;
    color: #667eea;
}

.result-status {
    font-size: 14px;
    color: #999;
    margin-top: 10px;
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>행운의 룰렛</h1>
    </div>

    <div class="page-content">
        <div class="roulette-section">
            <div class="roulette-wheel-container">
                <div class="roulette-pointer">▼</div>
                <div class="roulette-wheel" id="rouletteWheel"></div>
            </div>

            <div class="bet-section">
                <div class="bet-label">배팅 타입 선택</div>
                <div class="bet-options">
                    <button class="bet-btn active" data-type="odd" onclick="selectBetType('odd')">홀수</button>
                    <button class="bet-btn" data-type="even" onclick="selectBetType('even')">짝수</button>
                    <button class="bet-btn" data-type="red" onclick="selectBetType('red')">빨강</button>
                    <button class="bet-btn" data-type="white" onclick="selectBetType('white')">하양</button>
                </div>

                <div class="bet-label">베팅 금액</div>
                <input type="number" id="betAmount" class="bet-input" placeholder="금액 입력" min="0">

                <div class="current-gold" id="currentGold">보유 골드: 0G</div>
            </div>

            <button id="spinBtn" class="btn-spin">스핀!</button>

            <div id="resultDisplay" class="result-display">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-amount" id="resultAmount"></div>
                <div class="result-status" id="resultStatus"></div>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="roulette.js"></script>
</body>
</html>
