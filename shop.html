<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점 - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.shop-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.player-gold {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 14px;
    font-weight: 700;
    color: #111;
}

.shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f5f5f5;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
}

.item-info h3 {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    margin-bottom: 5px;
}

.item-info p {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
}

.item-price {
    font-size: 14px;
    font-weight: 700;
    color: #f5a623;
}

.item-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.buy-btn {
    padding: 10px 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.buy-btn:hover:not(:disabled) {
    opacity: 0.8;
}

.buy-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.quantity-input {
    width: 50px;
    padding: 6px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 12px;
    text-align: center;
}

.msg {
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    margin-top: 15px;
    display: none;
}

.msg.success {
    background: #d4edda;
    color: #155724;
    display: block;
}

.msg.error {
    background: #f8d7da;
    color: #721c24;
    display: block;
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>상점</h1>
    </div>

    <div class="page-content">
        <div class="shop-section">
            <div class="player-gold">
                보유 골드: <span id="playerGold">0</span>G
            </div>

            <div id="shopItems"></div>
            <div id="shopMsg" class="msg"></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="shop.js"></script>
</body>
</html>
