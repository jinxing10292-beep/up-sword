<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검 키우기 게임</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="screen">

  <!-- 프로필 카드 -->
  <div class="profile-card">
    <div class="profile-top">
      <div class="greeting">플레이어님<br>안녕하세요!</div>
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.9 1.7-9.9 5v2.3h19.8V19.5c0-3.3-6.6-5-9.9-5z"/></svg>
      </div>
    </div>

    <div class="stat-box">
      <div class="row">GOLD:<span class="gold">0</span>G</div>
      <div class="row">MONEY:<span class="money">0</span>M</div>
    </div>
  </div>

  <!-- 메뉴 카드 1 -->
  <div class="menu-card">
    <div class="menu-grid">
      <button class="menu-btn">랭킹</button>
      <button class="menu-btn">출석체크</button>
      <button class="menu-btn battle">배틀</button>
      <button class="menu-btn gm">GM</button>
    </div>
  </div>

  <!-- 메뉴 카드 2 -->
  <div class="menu-card">
    <div class="menu-grid">
      <button class="menu-btn">인벤토리</button>
      <button class="menu-btn">상점</button>
      <button class="menu-btn">업적</button>
      <button class="menu-btn">검도감</button>
    </div>
  </div>

  <!-- 프로모 카드 -->
  <div class="promo-row">
    <div class="promo-card sword">
      <div class="ribbon">NEW</div>
      <div class="promo-title">Sword<br>Upgrade</div>
      <div class="promo-sub">강화로 검을 성장시키세요!</div>
      <div class="promo-icon">🗡️</div>
    </div>
    <div class="promo-card soon">
      <div class="ribbon">NEW</div>
      <div class="exclaim">!</div>
      <div class="promo-title small">roulette</div>
      <div class="promo-sub">행운의 룰렛을 돌려보세요!</div>
    </div>
  </div>

  <!-- 하단 버튼 -->
  <div class="footer-row">
    <div class="footer-btn">고객센터</div>
    <div class="footer-btn">사이트맵</div>
  </div>

</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
