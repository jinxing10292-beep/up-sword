<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업적/검도감 - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.achievements-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.achievement-item {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
    display: flex;
    gap: 15px;
}

.achievement-icon {
    font-size: 32px;
    flex-shrink: 0;
}

.achievement-info h3 {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    margin-bottom: 5px;
}

.achievement-info p {
    font-size: 12px;
    color: #666;
}

.achievement-reward {
    font-size: 12px;
    font-weight: 700;
    color: #667eea;
    margin-top: 8px;
}

.locked {
    opacity: 0.5;
}

.soon-section {
    text-align: center;
    padding: 40px 20px;
}

.soon-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.soon-text {
    font-size: 16px;
    font-weight: 700;
    color: #111;
    margin-bottom: 10px;
}

.soon-badge {
    display: inline-block;
    padding: 8px 20px;
    background: #ffc107;
    color: #111;
    border-radius: 20px;
    font-weight: 700;
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>업적/검도감</h1>
    </div>

    <div class="page-content">
        <div class="achievements-section">
            <div class="soon-section">
                <div class="soon-icon">🏆</div>
                <div class="soon-text">업적 시스템</div>
                <div class="soon-badge">준비 중</div>
                <p style="margin-top: 30px; color: #999; font-size: 14px;">
                    업적 및 검도감 시스템이 준비 중입니다.<br>
                    곧 업데이트될 예정입니다!
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
