<head>

<title>배틀 - 검 키우기</title>

.battle-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;

    border-radius: 20px;

        <a href="index.html" class="back-btn">←</a>

    <div class="page-content">

            <div class="battle-text">배틀 시스템</div>
            <div class="soon-badge">준비 중</div>
            <p style="margin-top: 30px; color: #999; font-size: 14px;">
                다른 플레이어와의 배틀 기능이 준비 중입니다.<br>
                곧 업데이트될 예정입니다!
