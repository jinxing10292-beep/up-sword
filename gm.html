<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.gm-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.gm-login {
    margin-bottom: 20px;
}

.gm-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 10px;
}

.gm-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #b39ddb, #9c27b0);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.gm-btn:hover {
    opacity: 0.9;
}

.gm-menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
}

.gm-menu-btn {
    padding: 12px;
    background: #f5f5f5;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.gm-menu-btn:hover {
    background: #e0e0e0;
}

.msg {
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    margin-top: 15px;
    display: none;
}

.msg.success {
    background: #d4edda;
    color: #155724;
    display: block;
}

.msg.error {
    background: #f8d7da;
    color: #721c24;
    display: block;
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>GM</h1>
    </div>

    <div class="page-content">
        <div class="gm-section">
            <div id="gmLogin" class="gm-login">
                <h2 style="font-size: 16px; margin-bottom: 15px;">GM 인증</h2>
                <input type="password" id="gmPassword" class="gm-input" placeholder="GM 비밀번호">
                <button class="gm-btn" onclick="gmLogin()">로그인</button>
            </div>

            <div id="gmMenu" class="gm-menu" style="display: none;">
                <h2 style="font-size: 16px; margin-bottom: 10px;">GM 메뉴</h2>
                <button class="gm-menu-btn" onclick="addGold()">골드 추가</button>
                <button class="gm-menu-btn" onclick="addMoney()">머니 추가</button>
                <button class="gm-menu-btn" onclick="setSwordLevel()">검 레벨 설정</button>
                <button class="gm-menu-btn" onclick="resetPlayer()">플레이어 초기화</button>
                <button class="gm-menu-btn" onclick="gmLogout()">로그아웃</button>
            </div>

            <div id="gmMsg" class="msg"></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="gm.js"></script>
</body>
</html>
