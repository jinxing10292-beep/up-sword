<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강화 - 검 키우기</title>
<link rel="stylesheet" href="page.css">
<style>
.enhancement-section {
    background: white;
    border: 3px solid #111;
    border-radius: 28px;
    padding: 25px;
    margin-bottom: 20px;
}

.sword-display {
    text-align: center;
    margin-bottom: 20px;
}

.sword-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.sword-level {
    font-size: 28px;
    font-weight: 800;
    color: #111;
}

.enhancement-info {
    background: #f5f5f5;
    border-radius: 16px;
    padding: 15px;
    margin: 15px 0;
    font-size: 14px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
    font-weight: 700;
}

.rate-success { color: #4caf50; }
.rate-maintain { color: #ff9800; }
.rate-break { color: #f44336; }

.btn-enhance {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 15px;
}

.btn-enhance:hover:not(:disabled) {
    opacity: 0.9;
}

.btn-enhance:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.result-message {
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-top: 15px;
    display: none;
}

.result-success {
    background: #d4edda;
    color: #155724;
}

.result-maintain {
    background: #fff3cd;
    color: #856404;
}

.result-break {
    background: #f8d7da;
    color: #721c24;
}

.inventory-btn {
    width: 100%;
    padding: 12px;
    background: #7b5bd6;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}

.item-button-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.item-button-group button {
    padding: 12px;
    background: #e0e0e0;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="screen">
    <div class="page-header">
        <a href="index.html" class="back-btn">←</a>
        <h1>검 강화</h1>
    </div>

    <div class="page-content">
        <!-- 강화 섹션 -->
        <div class="enhancement-section">
            <div class="sword-display">
                <div class="sword-icon">🗡️</div>
                <div class="sword-level" id="displayLevel">+0</div>
            </div>

            <div class="enhancement-info">
                <div class="info-row">
                    <span>현재 레벨:</span>
                    <span id="currentLevel">+0</span>
                </div>
                <div class="info-row">
                    <span>누적 비용:</span>
                    <span id="cumulativeCost">0G</span>
                </div>
                <div class="info-row">
                    <span>보유 골드:</span>
                    <span id="currentGold">0G</span>
                </div>
            </div>

            <div class="enhancement-info">
                <div class="info-row rate-success">
                    <span>성공확률:</span>
                    <span id="successRate">100%</span>
                </div>
                <div class="info-row rate-maintain">
                    <span>유지확률:</span>
                    <span id="maintainRate">0%</span>
                </div>
                <div class="info-row rate-break">
                    <span>파괴확률:</span>
                    <span id="breakRate">0%</span>
                </div>
                <div class="info-row">
                    <span>필요 골드:</span>
                    <span id="costAmount">100G</span>
                </div>
            </div>

            <div id="resultMessage" class="result-message"></div>

            <button id="enhanceBtn" class="btn-enhance">강화하기</button>
            <button class="inventory-btn" onclick="window.location.href='inventory.html'">인벤토리</button>

            <div class="item-button-group">
                <button class="item-button" id="protectBtn" onclick="useProtect()">파괴방지권</button>
                <button class="item-button" id="scrollBtn" onclick="useScroll()">강화권</button>
            </div>
        </div>

        <!-- 판매 섹션 -->
        <div class="enhancement-section">
            <h3 style="margin-bottom: 15px; color: #111;">검 판매</h3>
            <div class="enhancement-info">
                <div class="info-row">
                    <span>판매가:</span>
                    <span id="sellPrice">0G</span>
                </div>
                <div class="info-row">
                    <span>손익:</span>
                    <span id="profitLoss">-누적비용</span>
                </div>
            </div>
            <button class="btn-enhance" style="background: linear-gradient(135deg, #f44336, #e91e63);" onclick="sellSword()">판매하기</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
