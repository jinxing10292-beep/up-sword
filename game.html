<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강화 - 검 키우기</title>
  <link rel="stylesheet" href="page.css">
  <style>
    body {
      background: #f3f3f3;
    }

    .screen {
      max-width: 500px;
      margin: 0 auto;
      background: #f3f3f3;
      padding-bottom: 32px;
    }

    .top-header {
      background: #1a2734;
      border-radius: 30px 30px 0 0;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 16px;
      color: #fff;
      border: 3px solid #111;
      border-bottom: none;
      margin-top: 18px;
    }

    .home-badge {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      filter: brightness(1.2);
      opacity: 0.95;
    }

    .player-name {
      flex: 1;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.06em;
      margin-left: 8px;
    }

    .header-currency {
      display: flex;
      align-items: center;
      gap: 18px;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -0.05em;
    }

    .gold-text {
      color: #f5b200;
    }

    .money-text {
      color: #fff;
    }

    .code-btn {
      background: #f3f3f3;
      color: #111;
      border: 0;
      border-radius: 18px;
      padding: 9px 16px;
      font-size: 18px;
      font-weight: 800;
      margin-left: 14px;
    }

    .upgrade-wrap {
      background: #ebebeb;
      border: 3px solid #111;
      border-top: 0;
      border-radius: 0 0 30px 30px;
      padding: 18px 20px 20px;
      min-height: 740px;
    }

    .upgrade-card {
      position: relative;
      background: #d8d8ef;
      border: 4px solid #111;
      border-radius: 24px;
      min-height: 300px;
      padding: 20px 20px 18px;
      overflow: hidden;
    }

    .upgrade-ribbon {
      position: absolute;
      top: 16px;
      left: -34px;
      width: 160px;
      background: #f7cd48;
      color: #111;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      padding: 5px 0;
      transform: rotate(-34deg);
    }

    .upgrade-title {
      font-size: 42px;
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.08em;
      margin: 18px 0 0;
      display: inline-block;
      max-width: 220px;
    }

    .upgrade-copy {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-align: center;
    }

    .sword-visual {
      position: absolute;
      bottom: 16px;
      right: 30px;
      width: 180px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 115px;
      transform: rotate(15deg) translateY(10px);
      filter: drop-shadow(0 7px 6px rgba(0,0,0,0.18));
    }

    .item-name {
      margin-top: 24px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-align: left;
      padding-left: 8px;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
      margin-top: 18px;
      padding: 0 8px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .stats-row .arrow {
      font-weight: 1000;
      font-size: 32px;
      transform: rotate(45deg);
    }

    .stats-row .value {
      min-width: 120px;
      text-align: right;
    }

    .buy-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 26px;
    }

    .action-btn {
      border: 0;
      border-radius: 18px;
      min-height: 70px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.04em;
      cursor: pointer;
    }

    .action-btn.secondary {
      background: #e0e0e0;
      color: #111;
    }

    .action-btn.primary {
      background: #2d3947;
      color: white;
    }

    .file-label {
      color: #9a9a9a;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-top: 20px;
      letter-spacing: -0.04em;
    }

    @media (max-width: 420px) {
      .player-name {
        font-size: 22px;
      }

      .header-currency {
        gap: 8px;
        font-size: 18px;
      }

      .upgrade-title {
        font-size: 34px;
      }

      .stats-row {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top-header">
      <div class="home-badge">🏠</div>
      <div class="player-name">플레이어님</div>
      <div class="header-currency">
        <span class="gold-text">7,000G</span>
        <span class="money-text">0M</span>
        <button class="code-btn">코드</button>
      </div>
    </div>

    <div class="upgrade-wrap">
      <div class="upgrade-card">
        <div class="upgrade-ribbon">NEW</div>
        <div class="upgrade-title">Sword<br>Upgrade</div>
        <div class="upgrade-copy">강화로 검을 성장시키세요!</div>
        <div class="sword-visual">🗡️</div>
      </div>

      <div class="item-name">[+1] 초보자의 검</div>

      <div class="stats-row">
        <div class="arrow">↗</div>
        <div class="value">12,800G</div>
      </div>
      <div class="stats-row">
        <div class="arrow">↗</div>
        <div class="value">18,865G</div>
      </div>
      <div class="stats-row">
        <div class="arrow">↗</div>
        <div class="value">% 60%</div>
      </div>

      <div class="buy-row">
        <button class="action-btn secondary" type="button">판매</button>
        <button class="action-btn primary" type="button">강화하기</button>
      </div>

      <div class="file-label">sword.html</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
</html>
