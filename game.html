<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검 강화 게임 - Sword Upgrade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 메인 페이지 -->
        <div id="mainPage" class="page active">
            <!-- 헤더: 플레이어명 + 재화 -->
            <div class="header">
                <div class="player-info">
                    <h1>플레이어님</h1>
                    <p>안녕하세요!</p>
                </div>
                <div class="profile-icon">👤</div>
            </div>

            <!-- 재화 표시 -->
            <div class="resources">
                <div class="resource-item">
                    <span class="resource-label">GOLD:</span>
                    <span class="resource-value" id="goldDisplay">0</span><span class="resource-unit">G</span>
                </div>
                <div class="resource-item">
                    <span class="resource-label">MONEY:</span>
                    <span class="resource-value" id="moneyDisplay">0</span><span class="resource-unit">M</span>
                </div>
            </div>

            <!-- 메뉴 버튼들 (2x2 그리드) -->
            <div class="menu-grid">
                <button class="menu-btn" id="rankingBtn">
                    <span>랭킹</span>
                </button>
                <button class="menu-btn" id="checkBtn">
                    <span>출석체크</span>
                </button>
                <button class="menu-btn pink" id="battleBtn">
                    <span>배틀</span>
                </button>
                <button class="menu-btn purple" id="gmBtn">
                    <span>GM</span>
                </button>
            </div>

            <!-- 추가 메뉴 -->
            <div class="extra-menu">
                <button class="menu-btn-sm" id="inventoryBtn">인벤토리</button>
                <button class="menu-btn-sm" id="missionBtn">미션</button>
                <button class="menu-btn-sm" id="shopBtn">검도감</button>
                <button class="menu-btn-sm" id="equipBtn">장비</button>
            </div>

            <!-- 메인 컨텐츠 (강화 시스템 + 룰렛) -->
            <div class="main-content">
                <!-- 검 강화 섹션 -->
                <div class="card upgrade-card">
                    <div class="new-badge">NEW</div>
                    <h3>Sword Upgrade</h3>
                    <p class="subtitle">강화도 검을 강화시키세요!</p>
                    <div class="sword-section">
                        <div class="sword-icon">🗡️</div>
                        <div class="sword-level">+<span id="swordLevel">0</span></div>
                    </div>
                    <button class="btn-enter" id="upgradeBtn">강화하기</button>
                </div>

                <!-- 룰렛 섹션 -->
                <div class="card roulette-card">
                    <div class="new-badge">NEW</div>
                    <h3>roulette</h3>
                    <p class="subtitle">새로운 게임을 준비중이에요!</p>
                    <div class="roulette-placeholder">
                        <span class="coming-soon-icon">❗</span>
                        <span class="coming-soon-text">COMING<br>SOON</span>
                    </div>
                    <button class="btn-enter coming-soon" id="rouletteBtn">준비중</button>
                </div>
            </div>
        </div>

        <!-- 강화 페이지 -->
        <div id="upgradePage" class="page">
            <div class="page-header">
                <button class="btn-back" id="backFromUpgrade">←</button>
                <h2>검 강화</h2>
                <div></div>
            </div>

            <div class="upgrade-container">
                <!-- 검 상태 표시 -->
                <div class="sword-status">
                    <div class="sword-display">
                        <div class="sword-visual">🗡️</div>
                        <div class="sword-info">
                            <p class="sword-name">검</p>
                            <p class="sword-level-text">강화 단계: <span id="displayLevel">+0</span></p>
                        </div>
                    </div>
                </div>

                <!-- 강화 정보 -->
                <div class="upgrade-info">
                    <div class="info-row">
                        <span>성공확률:</span>
                        <span class="success-rate" id="successRate">100%</span>
                    </div>
                    <div class="info-row">
                        <span>유지확률:</span>
                        <span class="maintain-rate" id="maintainRate">0%</span>
                    </div>
                    <div class="info-row">
                        <span>파괴확률:</span>
                        <span class="break-rate" id="breakRate">0%</span>
                    </div>
                    <div class="info-row cost">
                        <span>필요 비용:</span>
                        <span class="cost-amount" id="costAmount">100</span><span>G</span>
                    </div>
                </div>

                <!-- 강화 결과 메시지 -->
                <div class="result-message" id="resultMessage" style="display: none;">
                    <p id="resultText"></p>
                </div>

                <!-- 강화 버튼 -->
                <button class="btn-primary" id="enhanceBtn">강화하기</button>

                <!-- 누적 비용 표시 -->
                <div class="cumulative-cost">
                    <p>누적 강화 비용: <span id="cumulativeCost">0</span>G</p>
                </div>
            </div>
        </div>

        <!-- 룰렛 페이지 -->
        <div id="roulettePage" class="page">
            <div class="page-header">
                <button class="btn-back" id="backFromRoulette">←</button>
                <h2>룰렛</h2>
                <div></div>
            </div>

            <div class="roulette-container">
                <!-- 룰렛 휠 -->
                <div class="roulette-wheel-wrapper">
                    <div class="roulette-wheel" id="rouletteWheel">
                        <div class="roulette-slice" style="--slice-index: 0; --slice-color: #FF6B6B;"><span>2배</span></div>
                        <div class="roulette-slice" style="--slice-index: 1; --slice-color: #FFA500;"><span>꽝</span></div>
                        <div class="roulette-slice" style="--slice-index: 2; --slice-color: #4ECDC4;"><span>5배</span></div>
                        <div class="roulette-slice" style="--slice-index: 3; --slice-color: #95E1D3;"><span>1배</span></div>
                        <div class="roulette-slice" style="--slice-index: 4; --slice-color: #FFD93D;"><span>3배</span></div>
                        <div class="roulette-slice" style="--slice-index: 5; --slice-color: #A8E6CF;"><span>꽝</span></div>
                        <div class="roulette-slice" style="--slice-index: 6; --slice-color: #FF8B94;"><span>10배</span></div>
                        <div class="roulette-slice" style="--slice-index: 7; --slice-color: #C7CEEA;"><span>0.5배</span></div>
                    </div>
                    <div class="roulette-pointer">▼</div>
                </div>

                <!-- 베팅 정보 -->
                <div class="betting-section">
                    <div class="bet-info">
                        <p>현재 골드: <span id="rouletteGold">0</span>G</p>
                    </div>
                    
                    <div class="bet-input-group">
                        <label>베팅 금액:</label>
                        <div class="input-wrapper">
                            <input type="number" id="betAmount" placeholder="0" min="1">
                            <span>G</span>
                        </div>
                    </div>

                    <!-- 빠른 베팅 버튼 -->
                    <div class="quick-bet-buttons">
                        <button class="quick-bet" data-amount="1000">1K</button>
                        <button class="quick-bet" data-amount="10000">10K</button>
                        <button class="quick-bet" data-amount="100000">100K</button>
                        <button class="quick-bet" data-amount="1000000">1M</button>
                    </div>

                    <!-- 스핀 버튼 -->
                    <button class="btn-primary btn-spin" id="spinBtn">스핀</button>
                </div>

                <!-- 결과 메시지 -->
                <div class="roulette-result" id="rouletteResult" style="display: none;">
                    <p id="resultText"></p>
                    <p id="resultAmount"></p>
                </div>
            </div>
        </div>

        <!-- 랭킹 페이지 -->
        <div id="rankingPage" class="page">
            <div class="page-header">
                <button class="btn-back" id="backFromRanking">←</button>
                <h2>🏆 TOP 10 랭킹</h2>
                <div></div>
            </div>

            <div class="ranking-container">
                <div class="ranking-list" id="rankingList">
                    <!-- 랭킹이 JS로 동적으로 추가됨 -->
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
